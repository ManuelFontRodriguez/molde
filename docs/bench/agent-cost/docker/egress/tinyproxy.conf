# Allow-list proxy for the benchmark agent. Every request is logged (host only; HTTPS
# bodies are encrypted end to end and never seen), so the logs show what each run tried
# to reach. Anything not in allow.txt is refused with 403.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 20
Allow 0.0.0.0/0
ConnectPort 443
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
