# Dependency upgrades arrive as PRs, one per crate, so CI (including the engine
# contract in tests/engine_contract.rs) says whether each upgrade changes output.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # docs/git-conventions.md: dependency bumps are always chore(deps)
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope   # ci(deps): the scope is mandatory (pr-policy)
