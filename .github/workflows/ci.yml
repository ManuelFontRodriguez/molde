name: ci

# Every pull request and every push to main runs everything: the tests on Linux and
# macOS, the oldest supported Rust and the licence and advisory audit. release.yml calls
# this workflow before it builds anything. A newer push to a pull request cancels the
# older run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit, not by tag: a moved tag cannot change what runs.
# Dependabot (github-actions, monthly) proposes the new commit with its version.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux: where sites build. macOS: development, and the only runner with a
        # case-insensitive file system (paths.duplicate, assets).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      # --locked: CI tests exactly the committed Cargo.lock; upgrades come as dependabot PRs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The oldest Rust molde promises to build with (Cargo.toml `rust-version`).
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --all-targets

  # Licences of every compiled-in crate, known vulnerabilities (RustSec), and
  # crates from anywhere but crates.io. Policy in deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources
