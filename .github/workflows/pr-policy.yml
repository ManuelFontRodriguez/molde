name: pr-policy

# The PR title becomes the squash commit, and its type says what kind of release the
# change needs (docs/reference.md#compatibility). The rules are in
# .github/scripts/pr_policy.py and docs/git-conventions.md ("What CI checks"). Its own
# workflow, so that retitling a PR (`edited`) reruns this check alone, not the tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 test_pr_policy.py
        working-directory: .github/scripts
      # The title reaches the script through the environment, never through the shell.
      - run: python3 .github/scripts/pr_policy.py "$BASE_SHA" "$HEAD_SHA"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
